# Zusätzliche nginx-Anweisungen auf der eigenen MCP-Subdomain.
# Alle aufgeführten Pfade werden zur Brücke geleitet; kein location / nötig.
# Voraussetzung: Plesk und Container befinden sich auf demselben Host.
location ~ ^/(mcp/?$|authorize$|token$|register$|revoke$|healthz$|\.well-known/oauth-(authorization-server$|protected-resource(/mcp)?$)) {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 180s;
    client_max_body_size 32k;
    # Keine OAuth-Codes oder Parameter in nginx-Zugriffslogs schreiben.
    access_log off;
}
